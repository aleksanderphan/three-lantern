<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>Lantern Admin</title>
    <style>
      :root {
        --bg: #0a0a14;
        --panel: #14142388;
        --panel-solid: #141423;
        --line: #2a2a42;
        --text: #e8e6f0;
        --muted: #8d8aa3;
        --accent: #ffb86b;
        --danger: #ff6b7a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      header {
        display: flex; align-items: center; gap: 12px;
        padding: 14px 20px; border-bottom: 1px solid var(--line);
        position: sticky; top: 0; background: var(--bg); z-index: 5;
      }
      header h1 { font-size: 17px; margin: 0; flex: 1; }
      header h1 a { color: inherit; text-decoration: none; }
      main { max-width: 1100px; margin: 0 auto; padding: 20px; }
      h2 { margin: 0 0 14px; font-size: 20px; }
      button, .btn {
        font: inherit; color: var(--text); background: var(--panel-solid);
        border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px;
        cursor: pointer; text-decoration: none; display: inline-block;
      }
      button:hover, .btn:hover { border-color: var(--accent); }
      button:disabled { opacity: 0.5; cursor: default; }
      .primary { background: var(--accent); color: #1a1208; border-color: var(--accent); font-weight: 600; }
      .danger { color: var(--danger); }
      .danger:hover { border-color: var(--danger); }
      input[type="text"], input[type="search"], input[type="email"], input[type="password"], textarea {
        font: inherit; color: var(--text); background: var(--bg);
        border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%;
      }
      textarea { resize: vertical; min-height: 64px; }
      input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
      .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
      .grow { flex: 1; min-width: 160px; }
      .muted { color: var(--muted); font-size: 13px; }
      .mono { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }
      .login { max-width: 340px; margin: 12vh auto; display: grid; gap: 12px; }
      .list { display: grid; gap: 10px; margin-top: 16px; }
      .site {
        display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
        background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
      }
      .site a.name { color: var(--text); font-weight: 600; text-decoration: none; }
      .site a.name:hover { color: var(--accent); }
      .share {
        display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin: 16px 0;
        background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px;
      }
      .qr canvas { width: 160px; height: 160px; border-radius: 8px; display: block; }
      .share a.mono { color: var(--accent); word-break: break-all; }
      .drop {
        border: 2px dashed var(--line); border-radius: 12px; padding: 18px;
        text-align: center; color: var(--muted); margin: 16px 0;
      }
      .drop.over { border-color: var(--accent); color: var(--text); }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
      .card {
        background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
        padding: 10px; display: grid; gap: 8px; align-content: start;
      }
      .card img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 8px; background: #000; }
      .card .row { gap: 6px; }
      .card button { padding: 4px 9px; font-size: 13px; }
      #toast {
        position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
        background: var(--panel-solid); border: 1px solid var(--line); border-radius: 8px;
        padding: 8px 16px; opacity: 0; pointer-events: none; transition: opacity 0.2s;
      }
      #toast.show { opacity: 1; }
      #toast.err { border-color: var(--danger); color: var(--danger); }
    </style>
  </head>
  <body>
    <header>
      <h1><a href="#/">🏮 Lantern Admin</a></h1>
      <span id="who" class="muted"></span>
      <button id="logout" hidden>Sign out</button>
    </header>
    <main id="app"></main>
    <div id="toast"></div>
    <script type="module" src="/src/admin/main.js"></script>
  </body>
</html>
