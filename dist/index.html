<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Lantern Click Popup</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      #popup {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(1, 1, 1, 0.85);
        color: #fff;
        padding: 20px;
        border-radius: 10px;
        display: none;
        text-align: center;
        width: 250px;
      }
      #popup img {
        max-width: 100%;
        border-radius: 5px;
        margin-bottom: 10px;
      }
      #popup button {
        margin-top: 10px;
        padding: 5px 10px;
        border: none;
        background: #ffaa55;
        color: #000;
        cursor: pointer;
        border-radius: 5px;
      }
    </style>
    <script type="module" crossorigin src="/assets/index-hpaHYkhk.js"></script>
  </head>
  <body>
    <div id="popup">
      <img id="popupImage" src="" alt="Lantern Image" />
      <div id="popupText"></div>
      <button id="popupClose">Close</button>
    </div>

    <!-- Include Three.js from module -->
  </body>
</html>
