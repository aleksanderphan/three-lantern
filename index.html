<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ThreeJS Lantern</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: sans-serif;
      }

      /* Loader */
      #loader {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.6s ease;
      }
      #loader.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .spinner {
        width: 50px;
        height: 50px;
        border: 4px solid #fff;
        border-top: 4px solid transparent;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 10px;
      }
      @keyframes spin {
        100% {
          transform: rotate(360deg);
        }
      }
      #progress-text {
        color: #fff;
        font-family: sans-serif;
        font-size: 14px;
      }

      /* Close button shown while the camera is zoomed on a hanging scroll */
      #focusClose {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 100;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: 1px solid #d8a93a;
        background: #9c1c14;
        color: #fff3d6;
        font-size: 24px;
        line-height: 1;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.4s ease, visibility 0s linear 0.4s, background 0.2s ease;
      }
      #focusClose.show {
        opacity: 1;
        visibility: visible;
        transition: opacity 0.4s ease 0.8s, background 0.2s ease;
      }
      #focusClose:hover {
        background: #c42a1f;
      }
      #focusClose:focus-visible {
        outline: 2px solid #ffd27a;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <button id="focusClose" type="button" aria-label="Close">&times;</button>

    <div id="loader">
      <div class="spinner"></div>
      <p id="progress-text">Loading 0%</p>
    </div>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
