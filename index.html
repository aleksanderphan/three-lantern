<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Floating paper lanterns rise around a sakura tree under a starry sky." />
    <meta name="theme-color" content="#0a0a14" />
    <title>Three Lantern</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="loader" role="status" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <div class="progress" aria-hidden="true"><div id="progress-bar"></div></div>
      <p id="progress-text">Loading 0%</p>
    </div>

    <div id="popup" role="dialog" aria-modal="true" aria-labelledby="popupText" hidden>
      <div class="image-wrap">
        <img id="popupImage" alt="" width="560" height="320" />
        <div class="skeleton" aria-hidden="true"></div>
      </div>
      <p id="popupText"></p>
      <button id="popupClose" type="button">Close</button>
    </div>

    <p class="hint">Drag to look around · Tap a lantern</p>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
