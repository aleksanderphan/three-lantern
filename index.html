<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ThreeJS Lantern</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      /* Popup container */
      #popup {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0.9);
        background: radial-gradient(circle at top, #1c1c2b 0%, #0a0a14 100%);
        color: #fff;
        padding: 25px 20px;
        border-radius: 18px;
        display: none;
        text-align: center;
        width: 280px;
        max-width: 90%;
        box-shadow: 0 0 25px rgba(255, 120, 215, 0.4);
        border: 1px solid rgba(255, 120, 233, 0.4);
        backdrop-filter: blur(6px);
        animation: popupFade 0.4s ease forwards;
        overflow: hidden;
      }

      #popup::before {
        content: '';
        position: absolute;
        top: -40px;
        left: 50%;
        transform: translateX(-50%);
        width: 140px;
        height: 140px;
        background: radial-gradient(
          circle,
          rgba(255, 150, 194, 0.5),
          transparent 70%
        );
        border-radius: 50%;
        filter: blur(30px);
        z-index: -1;
      }
      #popup img {
        max-width: 100%;
        border-radius: 5px;
        margin-bottom: 10px;
      }
      #popup button {
        margin-top: 10px;
        padding: 5px 10px;
        border: none;
        background: #ffaa55;
        color: #000;
        cursor: pointer;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <div id="popup">
      <img id="popupImage" src="" alt="Lantern Image" />
      <div id="popupText"></div>
      <button id="popupClose">Close</button>
    </div>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
