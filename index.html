<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ThreeJS Lantern</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: sans-serif;
      }

      /* Loader */
      #loader {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.6s ease;
      }
      #loader.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .spinner {
        width: 50px;
        height: 50px;
        border: 4px solid #fff;
        border-top: 4px solid transparent;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 10px;
      }
      @keyframes spin {
        100% {
          transform: rotate(360deg);
        }
      }
      #progress-text {
        color: #fff;
        font-family: sans-serif;
        font-size: 14px;
      }

      /* Popup container */
      #popup {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0.95);
        background: radial-gradient(circle at top, #1c1c2b 0%, #0a0a14 100%);
        color: #fff;
        padding: 1.2em;
        border-radius: 1em;
        display: none;
        text-align: center;
        width: 90%;
        max-width: 350px;
        box-shadow: 0 0 25px rgba(255, 120, 215, 0.4);
        border: 1px solid rgba(255, 120, 233, 0.4);
        backdrop-filter: blur(6px);
        animation: popupFade 0.4s ease forwards;
        overflow: hidden;
      }

      #popup::before {
        content: '';
        position: absolute;
        top: -40px;
        left: 50%;
        transform: translateX(-50%);
        width: 140px;
        height: 140px;
        background: radial-gradient(
          circle,
          rgba(255, 150, 194, 0.5),
          transparent 70%
        );
        border-radius: 50%;
        filter: blur(30px);
        z-index: -1;
      }

      #popup img {
        max-width: 100%;
        border-radius: 8px;
        margin-bottom: 0.8em;
      }

      #popupText {
        font-size: 0.95em;
        line-height: 1.4em;
      }

      #popup button {
        margin-top: 1em;
        padding: 0.7em 1.2em;
        border: none;
        background: #9055ff;
        color: #000;
        cursor: pointer;
        border-radius: 6px;
        font-size: 1em;
        font-weight: 600;
        transition: background 0.2s ease;
      }

      #popup button:active {
        background: #df77ff;
      }

      @keyframes popupFade {
        from {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.8);
        }
        to {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1);
        }
      }
    </style>
  </head>
  <body>
    <div id="popup">
      <div class="image-wrap">
        <img
          id="popupImage"
          src=""
          alt="Lantern Image"
          width="560"
          height="320"
        />
        <div class="skeleton" aria-hidden="true"></div>
      </div>

      <div id="popupText"></div>
      <button id="popupClose">Close</button>
    </div>

    <div id="loader">
      <div class="spinner"></div>
      <p id="progress-text">Loading 0%</p>
    </div>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
