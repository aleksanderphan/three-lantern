<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Floating paper lanterns rise around a sakura tree under a starry sky." />
    <meta name="theme-color" content="#0a0a14" />
    <title>Three Lantern</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: sans-serif;
      }

      /* Loader */
      #loader {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.6s ease;
      }
      #loader.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .spinner {
        width: 50px;
        height: 50px;
        border: 4px solid #fff;
        border-top: 4px solid transparent;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 10px;
      }
      @keyframes spin {
        100% {
          transform: rotate(360deg);
        }
      }
      #progress-text {
        color: #fff;
        font-family: sans-serif;
        font-size: 14px;
      }

      .hint {
        position: fixed;
        bottom: max(16px, env(safe-area-inset-bottom));
        left: 50%;
        transform: translateX(-50%);
        margin: 0;
        padding: 0.4em 0.9em;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.35);
        color: #fff;
        font-size: 13px;
        opacity: 0.75;
        pointer-events: none;
        white-space: nowrap;
        transition: opacity 0.4s ease;
      }
      body.focused .hint {
        opacity: 0;
      }

      /* Close button shown while the camera is zoomed on a hanging scroll:
         a red lacquer plaque with a double gold border, like the scroll frames */
      #focusClose {
        position: fixed;
        bottom: calc(28px + env(safe-area-inset-bottom, 0px));
        left: 50%;
        transform: translateX(-50%);
        z-index: 100;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 11px 30px 12px;
        border-radius: 999px;
        border: 2px solid #d8a93a;
        background: linear-gradient(180deg, #c42a1f 0%, #9c1c14 55%, #7a130d 100%);
        color: #fff3d6;
        font: 600 17px/1 Georgia, "Times New Roman", serif;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.55);
        cursor: pointer;
        /* thin inner gold line, soft drop shadow, warm lantern-colored glow */
        box-shadow: inset 0 0 0 3px #7a130d, inset 0 0 0 4px rgba(216, 169, 58, 0.8),
          0 6px 18px rgba(0, 0, 0, 0.55), 0 0 26px rgba(255, 160, 64, 0.35);
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.4s ease, visibility 0s linear 0.4s, filter 0.2s ease, box-shadow 0.2s ease;
      }
      #focusClose::before,
      #focusClose::after {
        content: "";
        width: 7px;
        height: 7px;
        background: #d8a93a;
        transform: rotate(45deg); /* small gold diamonds either side of the label */
      }
      #focusClose.show {
        opacity: 1;
        visibility: visible;
        transition: opacity 0.4s ease 0.8s, filter 0.2s ease, box-shadow 0.2s ease;
      }
      #focusClose:hover {
        filter: brightness(1.15);
        box-shadow: inset 0 0 0 3px #7a130d, inset 0 0 0 4px #ffd27a,
          0 6px 18px rgba(0, 0, 0, 0.55), 0 0 34px rgba(255, 170, 70, 0.6);
      }
      #focusClose:active {
        filter: brightness(0.92);
      }
      #focusClose:focus-visible {
        outline: 2px solid #ffd27a;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <button id="focusClose" type="button">Close</button>

    <div id="loader">
      <div class="spinner"></div>
      <p id="progress-text">Loading 0%</p>
    </div>

    <p class="hint">Drag to look around · Tap a lantern</p>

    <script type="module" src="src/entry.js"></script>
  </body>
</html>
